name: Daily Job Fetch

on:
  workflow_dispatch:

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger job fetch
        run: |
          echo "Calling Render backend..."

          curl -i \
          -X POST \
          "${{ secrets.JOB_API_URL }}/admin/jobs/fetch" \
          -H "X-Automation-Key: ${{ secrets.JOB_AUTOMATION_SECRET }}"